<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanona — UI Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS — copy these into tailwind.config.ts
   ============================================================ */
:root{
  --primary:#2563EB;      --primary-hover:#1D4ED8;
  --success:#22C55E;      --danger:#EF4444;      --warning:#F59E0B;
  --bg:#F8FAFC;           --card:#FFFFFF;        --border:#E5E7EB;
  --text:#111827;         --text-2:#6B7280;      --text-3:#9CA3AF;
  --divider:#F1F5F9;      --hover:#F8FAFC;

  --blue-bg:#EFF6FF;      --blue-fg:#1D4ED8;     --blue-br:#BFDBFE;
  --green-bg:#ECFDF5;     --green-fg:#15803D;    --green-br:#BBF7D0;
  --red-bg:#FEF2F2;       --red-fg:#B91C1C;      --red-br:#FECACA;
  --amber-bg:#FFFBEB;     --amber-fg:#B45309;    --amber-br:#FDE68A;
  --grey-bg:#F3F4F6;      --grey-fg:#374151;

  --r:10px; --r-sm:8px; --r-lg:12px;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none}
a:hover{color:var(--primary-hover)}
input,select,button,textarea{font-family:inherit}
::placeholder{color:var(--text-3)}
table{border-collapse:collapse;width:100%}
h1,h2,h3{margin:0}

/* ---------- App shell ---------- */
.app{display:flex;flex-direction:column;min-height:100vh;min-width:1180px}
.navbar{height:72px;flex:none;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:var(--r-sm);background:var(--primary);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.brand-name{font-size:18px;font-weight:600;letter-spacing:-.01em}
.body{flex:1;display:flex;min-height:0}
.sidebar{width:250px;flex:none;background:var(--card);border-right:1px solid var(--border);padding:16px 12px}
.side-label{padding:0 10px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--text-3);text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 12px;margin-bottom:2px;
  border:none;border-radius:var(--r-sm);background:transparent;color:var(--text-2);
  font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--blue-bg);color:var(--primary);font-weight:600}
.main{flex:1;min-width:0;padding:32px}

/* ---------- Typography ---------- */
.page-title{font-size:32px;font-weight:700;letter-spacing:-.02em}
.page-sub{margin:6px 0 0;font-size:14px;color:var(--text-2)}
.card-title{font-size:18px;font-weight:600}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--text-2)}

/* ---------- Card ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.card-pad{padding:24px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px}

/* ---------- Buttons ---------- */
.btn{height:40px;padding:0 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn-primary{background:var(--primary);border:none;color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:#fff;border:1px solid var(--border);color:var(--grey-fg)}
.btn-secondary:hover{background:var(--hover)}
.btn-link{background:#fff;border:1px solid var(--blue-br);color:var(--primary);height:36px;padding:0 12px;font-size:13px}
.btn-link:hover{background:var(--blue-bg)}
.btn-danger{background:var(--danger);border:none;color:#fff}
.btn-danger:hover{background:#DC2626}
.btn:disabled{background:var(--hover);border:1px solid var(--border);color:var(--text-3);cursor:not-allowed}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;
  color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--divider);color:var(--text)}
.icon-btn.del:hover{background:var(--red-bg);color:var(--danger)}

/* ---------- Form ---------- */
.field{display:flex;flex-direction:column}
.label{font-size:14px;font-weight:500;margin-bottom:8px}
.req{color:var(--danger)}
.input,.select{height:44px;border:1px solid var(--border);border-radius:var(--r);padding:0 14px;
  font-size:14px;color:var(--text);background:#fff;outline:none;width:100%}
.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.input.error{border-color:var(--danger)}
.hint{font-size:12px;color:var(--text-2);margin-top:6px}
.hint.err{color:var(--danger)}
.select{appearance:none;padding-right:36px;cursor:pointer}
.select-wrap{position:relative}
.select-wrap svg{position:absolute;right:12px;top:14px;pointer-events:none}
.search{position:relative}
.search svg{position:absolute;left:12px;top:12px}
.search .input{padding-left:40px}
.upload{border:1px dashed var(--border);border-radius:var(--r);background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:16px}
.upload:hover{border-color:var(--primary);background:var(--blue-bg)}

/* ---------- Table ---------- */
th{text-align:left;font-size:14px;font-weight:500;color:var(--text-2);padding:12px 24px;border-bottom:1px solid var(--border);background:#fff}
td{height:52px;padding:0 24px;border-bottom:1px solid var(--divider);font-size:14px}
tbody tr:hover{background:var(--hover)}
.right{text-align:right}
.bold{font-weight:600}
.scroll-y{max-height:460px;overflow-y:auto}
.scroll-y th{position:sticky;top:0;z-index:1}
.scroll-x{overflow-x:auto}
.table-foot{padding:16px 24px;font-size:13px;color:var(--text-2)}
.toolbar{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;
  font-size:12px;font-weight:500;white-space:nowrap}
.chip-green{background:var(--green-bg);color:var(--green-fg)}
.chip-red{background:var(--red-bg);color:var(--red-fg)}
.chip-amber{background:var(--amber-bg);color:var(--amber-fg)}
.chip-blue{background:var(--blue-bg);color:var(--blue-fg)}
.chip-grey{background:var(--grey-bg);color:var(--grey-fg)}
.chip-sm{height:20px;padding:0 8px;font-size:11px}

/* ---------- Filter chips (Perlu Perhatian) ---------- */
.fchip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:var(--r-sm);
  background:#fff;font-size:13px;font-weight:500;cursor:pointer}
.fchip .count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
  padding:0 6px;border-radius:999px;font-size:12px;font-weight:600}
.fchip.red{border:1px solid var(--red-br);color:var(--red-fg)}
.fchip.red .count{background:var(--red-bg);color:var(--red-fg)}
.fchip.red.on{background:var(--red-bg);border-color:var(--red-fg);font-weight:600}
.fchip.amber{border:1px solid var(--amber-br);color:var(--amber-fg)}
.fchip.amber .count{background:var(--amber-bg);color:var(--amber-fg)}
.fchip.amber.on{background:var(--amber-bg);border-color:var(--amber-fg);font-weight:600}

/* ---------- Tabs ---------- */
.tabs-pill{display:inline-flex;padding:4px;background:var(--divider);border-radius:var(--r);margin-bottom:24px}
.tab-pill{height:36px;padding:0 16px;border:none;border-radius:var(--r-sm);background:transparent;
  color:var(--text-2);font-size:14px;font-weight:500;cursor:pointer}
.tab-pill.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(17,24,39,.08)}
.tabs-line{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-bottom:24px}
.tab-line{height:44px;padding:0 2px;margin-bottom:-1px;border:none;background:transparent;
  border-bottom:2px solid transparent;font-size:14px;font-weight:500;color:var(--text-2);cursor:pointer}
.tab-line.on{color:var(--primary);font-weight:600;border-bottom-color:var(--primary)}

/* ---------- Placeholders (replace with real images) ---------- */
.photo{border:1px solid var(--border);border-radius:var(--r-sm);
  background:repeating-linear-gradient(45deg,#F8FAFC 0 5px,#EEF2F7 5px 10px)}
.barcode{background:repeating-linear-gradient(90deg,#111827 0 2px,transparent 2px 4px,#111827 4px 5px,
  transparent 5px 8px,#111827 8px 10px,transparent 10px 13px)}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:24px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.stat-label{font-size:13px;font-weight:500;color:var(--text-2);line-height:1.3;height:34px}
.stat-value{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
/* Tinted stat cards. The tone carries the meaning: blue = a plain count,
   green = stock coming in, red = stock going out, amber = needs attention. */
.stat.blue {background:var(--blue-bg); border-color:var(--blue-br)}
.stat.green{background:var(--green-bg);border-color:var(--green-br)}
.stat.red  {background:var(--red-bg);  border-color:var(--red-br)}
.stat.amber{background:var(--amber-bg);border-color:var(--amber-br)}
.stat.blue  .stat-label{color:var(--blue-fg)}
.stat.green .stat-label{color:var(--green-fg)}
.stat.red   .stat-label{color:var(--red-fg)}
.stat.amber .stat-label{color:var(--amber-fg)}
.stat.blue  .stat-value{color:var(--primary)}
.stat.green .stat-value{color:var(--green-fg)}
.stat.red   .stat-value{color:var(--red-fg)}
.stat.amber .stat-value{color:var(--amber-fg)}

/* ---------- Empty & loading ---------- */
.empty{padding:80px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.empty h3{margin:20px 0 0;font-size:18px;font-weight:600}
.empty p{margin:8px 0 0;font-size:14px;color:var(--text-2);max-width:360px}
@keyframes sk{0%,100%{opacity:.5}50%{opacity:1}}
.sk{background:var(--divider);border-radius:6px;animation:sk 1.4s ease-in-out infinite}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;z-index:50}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:0 20px 50px rgba(17,24,39,.2);
  animation:modalIn .16s ease-out;width:600px;max-height:90vh;overflow-y:auto}
.modal.sm{width:460px}
.modal.preview{width:440px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-body{padding:24px}
.modal-foot{display:flex;justify-content:flex-end;gap:12px;padding:20px 24px;border-top:1px solid var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.span2{grid-column:1/-1}

/* SKU prefix input */
.sku-input{display:flex;align-items:stretch;height:44px;border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;background:#fff}
.sku-prefix{display:flex;align-items:center;padding:0 14px;background:var(--bg);
  border-right:1px solid var(--border);font:600 14px var(--mono);color:var(--text-2);white-space:nowrap}
.sku-input input{flex:1;min-width:0;border:none;padding:0 14px;font:14px var(--mono);outline:none;background:transparent}

/* ---------- Toast ---------- */
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast{position:fixed;right:32px;bottom:28px;z-index:60;display:flex;align-items:center;gap:12px;
  background:#fff;border:1px solid var(--border);border-radius:var(--r);
  box-shadow:0 8px 24px rgba(17,24,39,.12);padding:14px 14px 14px 16px;min-width:320px;animation:toastIn .18s ease-out}
.toast-icon{width:24px;height:24px;border-radius:999px;background:var(--success);
  display:flex;align-items:center;justify-content:center;flex:none}

/* ---------- Two-panel picker (Stock In / Out / Audit) ---------- */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.panel{height:631px;display:flex;flex-direction:column}   /* head + toolbar + 6 rows */
.panel-list{flex:1;min-height:0;overflow-y:auto}
.picker-row{display:flex;align-items:center;gap:14px;padding:16px 24px;
  border:none;border-bottom:1px solid var(--divider);
  cursor:pointer;background:#fff;width:100%;text-align:left;font:inherit;color:inherit;
  appearance:none;-webkit-appearance:none;border-radius:0}
.picker-row:hover{background:var(--hover)}
.picker-row.on{background:var(--blue-bg)}
.picker-row .stack span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-check{width:24px;height:24px;flex:none;border-radius:999px;background:var(--primary);
  display:flex;align-items:center;justify-content:center}
/* right-hand selection list */
.sel-row{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--divider)}
.sel-row .stack{flex:1;min-width:0}
.sel-row .stack span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-controls{display:flex;align-items:center;gap:8px;flex:none}
.qty-btn{width:44px;height:44px;padding:0;justify-content:center;font-size:18px;flex:none}
.qty-input{width:88px;height:44px;text-align:center;font-size:16px;font-weight:600;flex:none}
.diff-box{width:88px;height:44px;flex:none;border:1px solid;border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.empty-sel{flex:1;display:flex;align-items:center;justify-content:center;
  padding:24px;font-size:14px;color:var(--text-2);text-align:center}
/* scan button inset in the picker search field */
.search .scan-btn{position:absolute;right:6px;top:6px;width:32px;height:32px;padding:0;
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--blue-bg);
  color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer}
.search .scan-btn:hover{border-color:var(--blue-br)}
.search .scan-btn svg{position:static}
.search .input.with-scan{padding-right:48px}
.dropdown{position:absolute;top:66px;right:32px;background:#fff;border:1px solid var(--border);
  border-radius:var(--r);box-shadow:0 8px 24px rgba(17,24,39,.10);padding:6px;z-index:40;width:236px}
.menu-item{width:100%;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;
  border:none;background:transparent;border-radius:var(--r-sm);font-size:14px;color:var(--grey-fg);
  cursor:pointer;text-align:left}
.menu-item:hover{background:var(--hover)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger:hover{background:var(--red-bg)}
.stack{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ============================================================================
   KANONA — CLICKABLE PROTOTYPE
   ----------------------------------------------------------------------------
   Every screen below runs on the dummy data in DATA, held in memory only:
   reload the page and it is back to the seed. Recording stock really does
   change the numbers, write a history row and move the dashboard, so the
   whole flow can be walked end to end before any backend exists.

   What this prototype deliberately does NOT do — these belong to the server,
   see README.md:
     · the expected_stock check (two people counting the same shelf)
     · Row Level Security — here the role only hides things on screen
     · marketplace sync — the orders below are fixed sample rows, and
       Hubungkan Ulang stays inert until the channel APIs are connected
     · real barcode images and print CSS (bwip-js, week 3)

   In production every array in DATA becomes a query:
     DATA.products / DATA.variants  → products, variants
     DATA.movements                 → stock_movements (append only)
     DATA.orders / DATA.channels    → marketplace_orders, _connections
     DATA.users / DATA.categories   → profiles, categories
   ============================================================================ */

/* The prototype's "today". Seed rows are dated against it and new rows get it
   too, so "hari ini" on the dashboard means something. Production uses now(). */
const TODAY = '2026-08-25';

const DATA = {
  me: { name:'Andini Prameswari', email:'andini@kanona.id' },

  categories: ['Kemeja','Kaos','Celana','Dress','Outerwear','Rok'],

  products: [
    { name:'Kemeja Oxford Lengan Panjang', sku:'KMJ-OXF', category:'Kemeja',    threshold:10 },
    { name:'Kaos Katun Combed 30s',        sku:'KAO-CMB', category:'Kaos',      threshold:15 },
    { name:'Celana Chino Slim Fit',        sku:'CLN-CHN', category:'Celana',    threshold:10 },
    { name:'Dress Midi Linen',             sku:'DRS-MDL', category:'Dress',     threshold:8  },
    { name:'Blazer Formal Wanita',         sku:'BLZ-FRM', category:'Outerwear', threshold:6  },
    { name:'Hoodie Fleece Oversize',       sku:'HDE-FLC', category:'Outerwear', threshold:10 },
    { name:'Rok Plisket Midi',             sku:'ROK-PLS', category:'Rok',       threshold:8  },
    { name:'Jaket Denim Washed',           sku:'JKT-DNM', category:'Outerwear', threshold:6  },
  ],

  /* Stock lives here and nowhere else — product totals are added up from it. */
  variants: [
    { sku:'KMJ-OXF-NVY-S',   parent:'KMJ-OXF', color:'Navy',  size:'S',   price:189000, stock:48,  active:true  },
    { sku:'KMJ-OXF-NVY-M',   parent:'KMJ-OXF', color:'Navy',  size:'M',   price:189000, stock:96,  active:true  },
    { sku:'KMJ-OXF-NVY-L',   parent:'KMJ-OXF', color:'Navy',  size:'L',   price:189000, stock:42,  active:true  },
    { sku:'KMJ-OXF-NVY-XL',  parent:'KMJ-OXF', color:'Navy',  size:'XL',  price:199000, stock:31,  active:false },
    { sku:'KMJ-OXF-PTH-M',   parent:'KMJ-OXF', color:'Putih', size:'M',   price:189000, stock:87,  active:true  },
    { sku:'KMJ-OXF-PTH-XL',  parent:'KMJ-OXF', color:'Putih', size:'XL',  price:199000, stock:9,   active:true  },
    { sku:'KAO-CMB-HTM-M',   parent:'KAO-CMB', color:'Hitam', size:'M',   price:89000,  stock:186, active:true  },
    { sku:'KAO-CMB-HTM-L',   parent:'KAO-CMB', color:'Hitam', size:'L',   price:89000,  stock:124, active:true  },
    { sku:'KAO-CMB-PTH-L',   parent:'KAO-CMB', color:'Putih', size:'L',   price:89000,  stock:198, active:true  },
    { sku:'KAO-CMB-PTH-XL',  parent:'KAO-CMB', color:'Putih', size:'XL',  price:99000,  stock:10,  active:true  },
    { sku:'KAO-CMB-NVY-XXL', parent:'KAO-CMB', color:'Navy',  size:'XXL', price:99000,  stock:0,   active:true  },
    { sku:'CLN-CHN-KRM-30',  parent:'CLN-CHN', color:'Krem',  size:'30',  price:249000, stock:4,   active:true  },
    { sku:'CLN-CHN-KRM-32',  parent:'CLN-CHN', color:'Krem',  size:'32',  price:249000, stock:64,  active:true  },
    { sku:'CLN-CHN-HTM-34',  parent:'CLN-CHN', color:'Hitam', size:'34',  price:249000, stock:51,  active:true  },
    { sku:'DRS-MDL-CRM-S',   parent:'DRS-MDL', color:'Krem',  size:'S',   price:279000, stock:0,   active:true  },
    { sku:'DRS-MDL-CRM-M',   parent:'DRS-MDL', color:'Krem',  size:'M',   price:279000, stock:33,  active:true  },
    { sku:'BLZ-FRM-HTM-S',   parent:'BLZ-FRM', color:'Hitam', size:'S',   price:349000, stock:0,   active:true  },
    { sku:'BLZ-FRM-HTM-M',   parent:'BLZ-FRM', color:'Hitam', size:'M',   price:349000, stock:42,  active:true  },
    { sku:'HDE-FLC-ABU-L',   parent:'HDE-FLC', color:'Abu',   size:'L',   price:229000, stock:6,   active:true  },
    { sku:'HDE-FLC-ABU-XL',  parent:'HDE-FLC', color:'Abu',   size:'XL',  price:229000, stock:48,  active:true  },
    { sku:'ROK-PLS-HTM-S',   parent:'ROK-PLS', color:'Hitam', size:'S',   price:159000, stock:73,  active:true  },
    { sku:'ROK-PLS-HTM-M',   parent:'ROK-PLS', color:'Hitam', size:'M',   price:159000, stock:2,   active:true  },
    { sku:'JKT-DNM-BLU-M',   parent:'JKT-DNM', color:'Biru',  size:'M',   price:329000, stock:9,   active:true  },
    { sku:'JKT-DNM-BLU-L',   parent:'JKT-DNM', color:'Biru',  size:'L',   price:329000, stock:12,  active:true  },
    { sku:'JKT-DNM-BLU-XL',  parent:'JKT-DNM', color:'Biru',  size:'XL',  price:329000, stock:0,   active:true  },
  ],

  /* Append only, newest first. Each row's `after` is the stock the variant had

const productOf  = (parent) => DATA.products.find(p => p.sku === parent);
const variantOf  = (sku)    => DATA.variants.find(v => v.sku === sku);
const nameOf     = (sku)    => { const v = variantOf(sku); return v ? productOf(v.parent).name : sku; };
const variantsOf = (parent) => DATA.variants.filter(v => v.parent === parent);
const labelOf    = (v)      => `${v.color} · ${v.size}`;

/* A product row for the Produk table: counts and totals added up from variants */
function productRows(){
  return DATA.products.map(p => {
    const vs = variantsOf(p.sku);
    return { ...p, variants: vs.length, stock: vs.reduce((s,v) => s + v.stock, 0),
             firstSku: vs.length ? vs[0].sku : '—' };
  });
}

/* Habis = 0. Menipis = at or below the product's own threshold. */
function attention(){
  const habis = [], menipis = [];
  DATA.variants.forEach(v => {
    const p = productOf(v.parent);
    const row = { sku:v.sku, variant:`${p.name} · ${labelOf(v)}`, left:v.stock };
    if (v.stock === 0) habis.push(row);
    else if (v.stock <= p.threshold) menipis.push(row);
  });
  menipis.sort((a,b) => a.left - b.left);
  return { habis, menipis };
}

function stats(){
  const today = DATA.movements.filter(m => m.date === TODAY);
  const sum = (f) => today.filter(f).reduce((s,m) => s + Math.abs(m.change), 0);
  const a = attention();
  return [
    { label:'Total Produk',         value:num(DATA.products.length),  tone:'blue'  },
    { label:'Total Varian',         value:num(DATA.variants.length),  tone:'blue'  },
    { label:'Total Stok',           value:num(DATA.variants.reduce((s,v) => s + v.stock, 0)), tone:'blue' },
    { label:'Stok Masuk Hari Ini',  value:num(sum(m => m.change > 0)), tone:'green' },
    { label:'Stok Keluar Hari Ini', value:num(sum(m => m.change < 0)), tone:'red'   },

}

/* The five Riwayat Stok filters, applied in one place. In production this is
   the WHERE clause — the filtering happens in SQL, not in the browser. */
function historyRows(){
  const f = state.history;
  const q = f.q.trim().toLowerCase();
  return DATA.movements.filter(m => {
    if (f.from && m.date < f.from) return false;
    if (f.to   && m.date > f.to)   return false;
    if (f.activity && m.activity !== f.activity) return false;
    if (f.source   && m.source   !== f.source)   return false;
    if (f.user     && m.user     !== f.user)     return false;
    if (q && !(m.sku.toLowerCase().includes(q) || nameOf(m.sku).toLowerCase().includes(q))) return false;
    return true;
  });
}

/* The one path every stock change takes. On the server this is
   record_stock_movement: one transaction, the history row and the new stock
   written together, and the expected_stock check before either. */
function recordMovement({ sku, change, activity, source, user }){
  const v = variantOf(sku);
  const before = v.stock;
  const after = before + change;
  v.stock = after;
  DATA.movements.unshift({ date:TODAY, time:clock(), sku, before, change, after, activity, source, user });
}

/* ---------- picked-variant helpers (Stok Masuk / Stok Keluar / Audit Stok) ----
   `kind` is 'in' | 'out' | 'audit' and chooses which list in state is edited. */
const ROWS = { in:'inRows', out:'outRows', audit:'auditRows' };
const rowsOf    = (kind) => state[ROWS[kind]];
const pickedRow = (kind, sku) => rowsOf(kind).find(r => r.sku === sku);
const qtyNum    = (r) => +r.qty || 0;

function togglePick(kind, sku){
  const rows = rowsOf(kind);
  const i = rows.findIndex(r => r.sku === sku);
  if (i > -1) rows.splice(i, 1);
  else rows.push(kind === 'audit' ? { sku, physical:String(variantOf(sku).stock) } : { sku, qty:'1' });
  render();
}
function setRow(kind, sku, field, value){ pickedRow(kind, sku)[field] = digits(value); render(); }
function bumpQty(kind, sku, by){
  const r = pickedRow(kind, sku);
  r.qty = String(Math.max(0, qtyNum(r) + by));
  render();
}
function removePick(kind, sku){ togglePick(kind, sku); }
function clearPicks(kind){
  if (!rowsOf(kind).length) return;
  state[ROWS[kind]] = [];
  toast('Pilihan dibatalkan');
}

/* A USB scanner types the SKU and presses Enter. Typing it by hand does the
   same thing, which is the point of putting the SKU inside the barcode. */
function pickerKey(kind, e, value){
  if (e.key !== 'Enter') return;
  const code = value.trim().toUpperCase();
  const v = DATA.variants.find(x => x.sku === code) ||
            (pickerList(kind).length === 1 ? pickerList(kind)[0] : null);
  if (!v)                          return toast('SKU tidak ditemukan: ' + (code || '(kosong)'));
  if (kind !== 'audit' && !v.active) return toast(v.sku + ' nonaktif, tidak bisa dipilih di sini.');
  if (pickedRow(kind, v.sku))      return toast(v.sku + ' sudah ada di daftar.');
  state.pick[kind].q = '';
  togglePick(kind, v.sku);
  toast(v.sku + ' ditambahkan');
}

function saveStockIn(){
  const rows = state.inRows.filter(r => qtyNum(r) > 0);
  if (!rows.length) return toast('Isi jumlah lebih besar dari 0 dulu.');
  rows.forEach(r => recordMovement({ sku:r.sku, change:qtyNum(r),
    activity:'Stok Masuk', source:'Manual', user:DATA.me.name }));
  state.inRows = [];
  toast(`Stok masuk tersimpan untuk ${rows.length} varian`);
}

function saveStockOut(){
  const rows = state.outRows.filter(r => qtyNum(r) > 0);
  if (!rows.length) return toast('Isi jumlah lebih besar dari 0 dulu.');
  const over = rows.find(r => qtyNum(r) > variantOf(r.sku).stock);
  if (over) return toast(`${over.sku} hanya punya ${variantOf(over.sku).stock} stok. Tidak ada yang disimpan.`);
  rows.forEach(r => recordMovement({ sku:r.sku, change:-qtyNum(r),
    activity:'Stok Keluar', source:'Manual', user:DATA.me.name }));
  state.outRows = [];
  toast(`Stok keluar tersimpan untuk ${rows.length} varian`);
}

/* A zero difference writes no row at all — there is nothing to record. */
function saveAudit(){
  const rows = state.auditRows.map(r => ({ r, diff: (+r.physical || 0) - variantOf(r.sku).stock }));
  const changed = rows.filter(x => x.diff !== 0);
  if (!rows.length)    return toast('Pilih varian dulu.');
  if (!changed.length) return toast('Tidak ada selisih — tidak ada yang perlu dicatat.');
  changed.forEach(x => recordMovement({ sku:x.r.sku, change:x.diff,
    activity:'Penyesuaian', source:'Audit Stok', user:DATA.me.name }));
  state.auditRows = [];
  toast(`Penyesuaian tersimpan untuk ${changed.length} varian`);
}

/* ---------- Riwayat Stok ---------- */
function exportCsv(){
  const rows = historyRows();
  if (!rows.length) return toast('Tidak ada catatan untuk diekspor.');
  const head = ['Tanggal','Waktu','SKU','Produk','Varian','Sebelum','Perubahan','Sesudah','Aktivitas','Sumber','Pengguna'];
  const body = rows.map(m => {
    const v = variantOf(m.sku);
    return [fmtDate(m.date), m.time, m.sku, nameOf(m.sku), v ? labelOf(v) : '',
            m.before, m.change, m.after, m.activity, m.source, m.user];
  });
  const csv = [head, ...body].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href:url, download:`riwayat-stok-${TODAY}.csv` });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`${rows.length} catatan diekspor ke CSV`);
}

  const q = state.barcode.q.trim().toLowerCase();
  const cat = state.barcode.cat;
  return DATA.products
    .filter(p => !cat || p.category === cat)
    .map(p => ({ p, variants: variantsOf(p.sku).filter(v => v.active &&
        (!q || v.sku.toLowerCase().includes(q) || p.name.toLowerCase().includes(q) ||
         labelOf(v).toLowerCase().includes(q))) }))
    .filter(g => g.variants.length);
}
function toggleLabel(sku, on){
  if (on) state.barcode.sel[sku] = state.barcode.sel[sku] || 10;
  else delete state.barcode.sel[sku];
  render();
}
function setLabelQty(sku, value){
  const n = +digits(value);
  if (n > 0) state.barcode.sel[sku] = n; else state.barcode.sel[sku] = '';
  render();
}
function toggleGroup(parent, on){
  barcodeGroups().find(g => g.p.sku === parent).variants
    .forEach(v => { if (on) state.barcode.sel[v.sku] = state.barcode.sel[v.sku] || 10;
                    else delete state.barcode.sel[v.sku]; });
  render();
}
function toggleAllLabels(on){
  barcodeGroups().forEach(g => g.variants
    .forEach(v => { if (on) state.barcode.sel[v.sku] = state.barcode.sel[v.sku] || 10;
                    else delete state.barcode.sel[v.sku]; }));
  render();
}

/* ---------- dialogs ---------- */
function openModal(kind, mode='add', target=null){
  state.modal = kind; state.modalMode = mode; state.editing = target; state.formErr = {};
  const f = {};
  if (kind === 'product') Object.assign(f, mode === 'edit'
    ? { ...target }
    : { name:'', sku:'', category:DATA.categories[0], threshold:'10' });
  if (kind === 'variant') Object.assign(f, mode === 'edit'
    ? { code: target.sku.slice(target.parent.length + 1), color:target.color, size:target.size,
        price:String(target.price), active:target.active, parent:target.parent }
    : { code:'', color:'', size:'M', price:'', active:true, parent:target.parent });
  if (kind === 'user') Object.assign(f, mode === 'edit'
    ? { ...target, password:'' }
    : { name:'', email:'', role:'Manager', active:true, password:'' });
  if (kind === 'category') Object.assign(f, { name: mode === 'edit' ? target : '' });
  if (kind === 'password') Object.assign(f, { current:'', next:'', confirm:'' });
  state.form = f;
  render();
}
function closeModal(){ state.modal = null; state.editing = null; state.form = {}; state.formErr = {}; render(); }
function setForm(field, value){ state.form[field] = value; delete state.formErr[field]; render(); }
function askConfirm(c){ state.confirm = c; state.modal = 'confirm'; render(); }
function confirmOk(){ const c = state.confirm; state.modal = null; state.confirm = null; c.onOk(); }

function saveProduct(){
  const f = state.form, err = {};
  const sku = f.sku.trim().toUpperCase();
  if (!f.name.trim()) err.name = 'Nama produk wajib diisi.';
  if (!sku)           err.sku  = 'SKU induk wajib diisi.';
  else if (DATA.products.some(p => p.sku === sku && p !== state.editing))
    err.sku = 'SKU induk ini sudah dipakai produk lain.';
  state.formErr = err;
  if (Object.keys(err).length) return render();

  if (state.modalMode === 'edit'){
    const old = state.editing.sku;
    Object.assign(state.editing, { name:f.name.trim(), sku, category:f.category, threshold:+f.threshold || 10 });
    if (old !== sku) variantsOf(old).forEach(v => { v.parent = sku; v.sku = sku + v.sku.slice(old.length); });
    if (state.detailSku === old) state.detailSku = sku;
  } else {
    DATA.products.push({ name:f.name.trim(), sku, category:f.category, threshold:+f.threshold || 10 });
  }
  closeModal();
  toast(state.modalMode === 'edit' ? 'Produk berhasil diperbarui' : 'Produk berhasil dibuat');
}

function saveVariant(){
  const f = state.form, err = {};
  const code = f.code.trim().toUpperCase();
  const full = f.parent + '-' + code;
  if (!code)           err.code  = 'Kode varian wajib diisi.';
  else if (DATA.variants.some(v => v.sku === full && v !== state.editing))
    err.code = 'Kode varian ini sudah dipakai.';
  if (!f.color.trim()) err.color = 'Warna wajib diisi.';
  if (!+digits(f.price)) err.price = 'Harga tidak boleh kosong.';
  state.formErr = err;
  if (Object.keys(err).length) return render();

  const row = { sku:full, parent:f.parent, color:f.color.trim(), size:f.size,
                price:+digits(f.price), active:f.active };
  if (state.modalMode === 'edit') Object.assign(state.editing, row);
  else DATA.variants.push({ ...row, stock:0 });
  closeModal();
  toast('Varian berhasil disimpan');
}

function saveUser(){
  const f = state.form, err = {};
  if (!f.name.trim())  err.name  = 'Nama wajib diisi.';
  if (!/^\S+@\S+\.\S+$/.test(f.email.trim())) err.email = 'Alamat email tidak valid.';
  else if (DATA.users.some(u => u.email === f.email.trim() && u !== state.editing))
    err.email = 'Email ini sudah dipakai.';
  if (state.modalMode === 'add' && f.password.length < 8) err.password = 'Minimal 8 karakter.';
  state.formErr = err;
  if (Object.keys(err).length) return render();

  const row = { name:f.name.trim(), email:f.email.trim(), role:f.role, active:f.active };
  if (state.modalMode === 'edit') Object.assign(state.editing, row);
  else DATA.users.push(row);
  closeModal();
  toast(state.modalMode === 'edit' ? 'Data pengguna diperbarui' : 'Akun karyawan berhasil dibuat');
}

function saveCategory(){
  const name = state.form.name.trim();
  if (!name) { state.formErr = { name:'Nama kategori wajib diisi.' }; return render(); }
  if (DATA.categories.some(c => c.toLowerCase() === name.toLowerCase() && c !== state.editing)){
    state.formErr = { name:'Kategori ini sudah ada.' }; return render();
  }
  if (state.modalMode === 'edit'){
    DATA.products.forEach(p => { if (p.category === state.editing) p.category = name; });
    DATA.categories[DATA.categories.indexOf(state.editing)] = name;
  } else DATA.categories.push(name);
  closeModal();
  toast('Kategori berhasil disimpan');
}

function savePassword(){
  const f = state.form, err = {};
  if (state.editing.email === DATA.me.email && !f.current) err.current = 'Kata sandi saat ini wajib diisi.';
  if (f.next.length < 8)     err.next    = 'Minimal 8 karakter.';
  if (f.next !== f.confirm)  err.confirm = 'Konfirmasi tidak sama.';
  state.formErr = err;
  if (Object.keys(err).length) return render();
  closeModal();
  toast('Kata sandi berhasil diubah');
}

/* Products and variants can be removed. Users cannot — their name is still on
   history rows, so leaving is is_active = false. */
function deleteProduct(p){
  askConfirm({ title:`Hapus ${p.name}?`, label:'Hapus', danger:true,
    body:`${variantsOf(p.sku).length} varian ikut terhapus. Riwayat stok yang sudah tercatat tetap tersimpan.`,
    onOk(){
      DATA.variants = DATA.variants.filter(v => v.parent !== p.sku);
      DATA.products.splice(DATA.products.indexOf(p), 1);
      if (state.page === 'detail') state.page = 'produk';
      toast('Produk berhasil dihapus');
    }});
}
function deleteVariant(v){
  askConfirm({ title:`Hapus varian ${v.sku}?`, label:'Hapus', danger:true,
    body:'Riwayat stok yang sudah tercatat tetap tersimpan.',
    onOk(){
      DATA.variants.splice(DATA.variants.indexOf(v), 1);
      ['in','out','audit'].forEach(k => { state[ROWS[k]] = rowsOf(k).filter(r => r.sku !== v.sku); });
      delete state.barcode.sel[v.sku];
      toast('Varian berhasil dihapus');
    }});
}
function deactivateUser(u){
  askConfirm({ title:`Nonaktifkan akun ${u.name}?`, label:'Nonaktifkan', danger:true,
    body:'Akun tidak dihapus — namanya masih dipakai di riwayat stok. Akun tidak bisa masuk lagi sampai diaktifkan kembali.',
    onOk(){ u.active = false; toast('Akun dinonaktifkan'); }});
}
function deleteCategory(name){
  const used = DATA.products.filter(p => p.category === name).length;
  if (used) return toast(`Kategori ini masih dipakai ${used} produk.`);
  askConfirm({ title:`Hapus kategori ${name}?`, label:'Hapus', danger:true,
    body:'Kategori yang tidak dipakai produk mana pun aman dihapus.',
    onOk(){ DATA.categories.splice(DATA.categories.indexOf(name), 1); toast('Kategori berhasil dihapus'); }});
}

/* ---------- masuk / keluar ---------- */
function login(){
  const u = DATA.users.find(x => x.email === state.form.email.trim().toLowerCase());
  if (!u)         { state.formErr = { email:'Email tidak terdaftar.' }; return render(); }
  if (!u.active)  { state.formErr = { email:'Akun ini nonaktif. Hubungi Owner.' }; return render(); }
  if (!state.form.password) { state.formErr = { password:'Kata sandi wajib diisi.' }; return render(); }
  DATA.me = { name:u.name, email:u.email };
  state.role = u.role;
  state.authed = true; state.page = 'dashboard'; state.form = {}; state.formErr = {};
  toast(`Selamat datang, ${u.name.split(' ')[0]}`);
}
function logout(){
  askConfirm({ title:'Keluar dari Kanona?', label:'Keluar', danger:false,
    body:'Pekerjaan yang belum disimpan di Stok Masuk, Stok Keluar dan Audit Stok akan hilang.',
    onOk(){
      state.authed = false; state.profileOpen = false;
      state.form = { email:'', password:'' }; state.formErr = {};
      render();
    }});
}

/* ---------- Shared two-panel picker ----------------------------------------
   Left panel: every variant, ticked on or off. Right panel: the ones ticked,
   each with the number being recorded. Reused by Stok Masuk, Stok Keluar
   (Manual tab) and Audit Stok — in production this is VariantPicker.tsx. */
function pickerList(kind){
  const f = state.pick[kind];
  const q = f.q.trim().toLowerCase();
  return DATA.variants.filter(v => {
    /* Inactive variants are hidden from Stok Masuk and Stok Keluar, but stay
       in Audit Stok — the goods may still be on the shelf. */
    if (kind !== 'audit' && !v.active) return false;
    const p = productOf(v.parent);
    if (f.cat && p.category !== f.cat) return false;
    if (q && !(v.sku.toLowerCase().includes(q) || p.name.toLowerCase().includes(q) ||
               labelOf(v).toLowerCase().includes(q))) return false;
    return true;
  });
}

function variantPicker(kind){
  const list = pickerList(kind);
  const f = state.pick[kind];
  return `
  <div class="card panel">
    <div class="card-head" style="flex:none">
      <h2 class="card-title">Pilih Varian</h2>
      <span style="font-size:13px;color:var(--text-2)">${list.length} varian</span>
    </div>
    <div class="toolbar" style="flex:none">
      <div class="search" style="flex:1;min-width:0">
        ${icon('search',20,'#9CA3AF')}
        <input class="input with-scan" data-fid="pick-${kind}" placeholder="Cari nama produk atau SKU"
          value="${esc(f.q)}" oninput="state.pick.${kind}.q=this.value;render()"
          onkeydown="pickerKey('${kind}',event,this.value)">
        <button class="scan-btn" title="Pindai barcode — ketik atau pindai SKU lalu tekan Enter"
          onclick="focusPick('${kind}')">${icon('scan',18)}</button>
      </div>
      ${selectBox(['Semua Kategori', ...DATA.categories], f.cat || 'Semua Kategori',
        `state.pick.${kind}.cat=this.value==='Semua Kategori'?'':this.value;render()`)}
    </div>
    <div class="panel-list">
      ${list.length ? list.map(v => {
        const on = !!pickedRow(kind, v.sku);
        return `
        <button class="picker-row ${on?'on':''}" onclick="togglePick('${kind}','${v.sku}')">
          ${photoBox(48)}
          <span class="stack" style="flex:1;min-width:0">
            <span style="font-size:15px;font-weight:600">${nameOf(v.sku)}</span>
            <span style="font-size:13px;color:var(--text-2)">
              <span class="mono">${v.sku}</span> · ${labelOf(v)} · ${rupiah(v.price)}${v.active?'':' · nonaktif'}</span>
          </span>
          <span class="stack" style="align-items:flex-end">
            <span style="font-size:16px;font-weight:700">${num(v.stock)}</span>
            <span style="font-size:12px;color:var(--text-3)">stok</span>
          </span>
          ${on ? `<span class="pick-check">${icon('check',14,'#fff',2.6)}</span>` : ''}
        </button>`;
      }).join('')
      : emptyState('Varian tidak ditemukan', 'Coba kata kunci lain atau ganti kategori.')}
    </div>
  </div>`;
}
function focusPick(kind){
  const el = document.querySelector(`[data-fid="pick-${kind}"]`);
  if (el) el.focus();
  toast('Pindai barcode atau ketik SKU, lalu tekan Enter');
}

/* The right-hand panel. Only the controls on each row differ per screen. */
function selectionPanel(kind, title){
  const rows = rowsOf(kind);
  return `
  <div class="card panel">

const qtyControls = (kind, r, v) => `
  <button class="btn btn-secondary qty-btn" onclick="bumpQty('${kind}','${r.sku}',-1)">−</button>
  <input class="input qty-input ${kind==='out' && qtyNum(r) > v.stock ? 'error' : ''}"
    data-fid="qty-${kind}-${r.sku}" inputmode="numeric" value="${r.qty}"
    oninput="setRow('${kind}','${r.sku}','qty',this.value)">
  <button class="btn btn-secondary qty-btn" onclick="bumpQty('${kind}','${r.sku}',1)">+</button>`;

/* Selisih = physical count − system stock. Zero writes no movement row at all,
   so it is shown neutral rather than as a change. */
function auditControls(r, v){
  const diff = (+r.physical || 0) - v.stock;
  const tone = diff === 0 ? ['var(--bg)','var(--text-2)','var(--border)']
    : diff < 0 ? ['var(--red-bg)','var(--red-fg)','var(--red-br)']
               : ['var(--green-bg)','var(--green-fg)','var(--green-br)'];
  return `
  <input class="input qty-input" data-fid="qty-audit-${r.sku}" inputmode="numeric" value="${r.physical}"
    oninput="setRow('audit','${r.sku}','physical',this.value)">
  <div class="diff-box" style="background:${tone[0]};color:${tone[1]};border-color:${tone[2]}"
    title="Selisih">${diff === 0 ? '0' : signed(diff)}</div>`;
}

/* ============================================================================
   RENDER
   ----------------------------------------------------------------------------
   The whole screen is rebuilt on every change, which is simple to follow but
   throws away the focused field — so the caret is put back afterwards by
   data-fid. React keeps the DOM between renders and needs none of this.
   ============================================================================ */
function render(){
  const a = document.activeElement;
  const fid = a && a.dataset ? a.dataset.fid : null;
  let pos = null;
  try { pos = a && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null; } catch(e){}

  document.getElementById('app').innerHTML = state.authed
    ? shell((pages[state.page] || pages.dashboard)())
    : loginPage();

  /* indeterminate is a property, not an attribute — it cannot be set in HTML */
  document.querySelectorAll('[data-indet="1"]').forEach(el => { el.indeterminate = true; });

  if (fid){
    const el = document.querySelector(`[data-fid="${fid}"]`);
    if (el){
      el.focus();
      try { if (pos && el.setSelectionRange) el.setSelectionRange(pos[0], pos[1]); } catch(e){}
    }
  }
}
render();
</script>
